
camera_fusion_node:
  ros__parameters:
    # --- Performance Tuning ---
    # Toggle to true to enable downsampling. Massive CPU savings for downstream nodes.
    enable_downsampling: true
    # Resolution of the 3D grid (meters). 0.025 = 2.5cm cubes.
    voxel_leaf_size: 0.001

seedbed_segmentation_node:
  ros__parameters:
    # --- Normal Estimation ---
    # How many neighbor points to use when calculating the surface normal.
    # Increase (e.g., 50) if the camera data is noisy to smooth out the walls. Decrease (e.g., 15) to keep sharp details but risk noise.
    normal_k_search: 30       
    
    # How strictly the wall must face the left/right (+/- Y axis). 
    # 1.0 means perfectly vertical. Lower this (e.g., 0.5) if your dirt walls are heavily slanted and getting deleted.
    y_normal_tolerance: 0.74             

    # --- Noise Filtering ---
    # Number of neighbor points analyzed by the Statistical Outlier Removal (SOR) filter.
    sor_mean_k: 30                      
    
    # How aggressively to delete floating noise. 
    # Lower value (e.g., 0.05) deletes more points. Raise it (e.g., 1.0) if valid wall points are disappearing.
    sor_stddev_mul_thresh: 0.8          
    
    # Filters out stray posts or objects far outside the seedbed using a Z-score.
    # Lower it (e.g., 1.0) to aggressively narrow the acceptable lateral width. Raise it (e.g., 2.5) if the outer walls are being cut off.
    y_z_score_threshold: 2.5            

    # --- Gap Filling ---
    # The resolution (in meters) of the generated 2D seedbed grid. 
    # 0.01 = 1 cm dots. Increase to 0.03 or 0.05 to save CPU power; decrease for a denser path.
    fill_resolution: 0.01               

    max_wall_height: 0.55 #max height of the acceptable seed_bed
    veto_grid_res: 0.1 #resolution of the shadow grid

path_extraction_node:
  ros__parameters:
    # How thick each forward slice of the point cloud is (in meters).
    slice_depth: 0.05                   
    
    # The maximum distance (in meters) the robot looks ahead to build the polynomial curve.
    # Increase if you want the robot to react to curves earlier.
    forward_limit: 2.0                  
    
    # The exact distance (in meters) ahead of the robot where the steering angle is calculated.
    # Must be less than forward_limit. Increase for smoother, wider turns; decrease for sharp, immediate reactions.
    lookahead_x: 1.5                  
    
    # If the gap between the walls in a single slice is wider than this (meters), it is discarded as noise.
    max_slice_width: 1.2                
    
    # The absolute minimum number of slices needed to draw a path. 
    # If less than this number of slices are found, the robot stops steering.
    min_valid_centroids: 2              
    
    # Purely visual: The width (in meters) of the boundary lines drawn in RViz2.
    marker_half_span: 1.0               

angular_pid_node:
  ros__parameters:
    # --- PID Steering Control ---
    # Proportional gain: The main steering force. Increase if the robot is sluggish to turn; decrease if it fishtails/oscillates.
    kp: 1.0                             
    
    # Integral gain: Corrects continuous drift (e.g., driving on a tilted slope). Usually kept at 0.0 for simple path following.
    ki: 0.0                             
    
    # Derivative gain: The dampener. Increase this to stop the robot from overshooting the centerline and wobbling.
    kd: 2.0                             
    
    # Prevents the 'ki' term from building up to infinity if the robot gets physically stuck.
    max_integral: 10.0                  

    # --- Velocity & Braking ---
    # The absolute maximum forward speed (m/s) when driving perfectly straight.
    linear_x: 0.07                      
    
    # The absolute minimum forward speed (m/s). Ensures the robot doesn't completely stop during sharp turns.
    min_linear_x: 0.05                  
    
    # How aggressively the robot hits the brakes when steering. 
    # Higher value = slows down heavily on curves. Lower value = maintains speed through curves.
    speed_reduction_factor: 0.5        

    # --- Hardware Smoothing ---
    # Low-pass filter for acceleration (0.0 to 1.0). 
    # Lower (e.g., 0.05) = very slow, smooth acceleration. Higher (1.0) = instant, jerky acceleration.
    speed_smoothing: 0.1                
    
    # Low-pass filter for steering (0.0 to 1.0). 
    # Lower (e.g., 0.1) smooths out noisy camera data to stop jittery wheels. Higher (1.0) reacts instantly to the path.
    angular_smoothing: 0.5              
    
    # Prevents spamming the motor controller. Only publishes a new speed if the value changes by this much.
    deadband: 0.02                      
    
    # The ROS 2 topic the motor controller listens to.
    velocity_topic: "/cmd_vel"